spring.application.name=fantesday
spring.config.import=optional:file:.env[.properties]

# Supabase (PostgreSQL) database configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# JWT: sem JWT_SECRET (min. 32 caracteres) a API gera uma chave aleatoria a cada inicializacao
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=24h

# Origens liberadas para o frontend (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# XP ganho ao concluir uma tarefa
app.xp.task-completed=10

# Importa TACO e free-exercise-db na primeira execucao (resources/seed)
app.seed.enabled=true

# Open Food Facts (produtos industrializados)
app.openfoodfacts.base-url=https://world.openfoodfacts.org
app.openfoodfacts.user-agent=FantesDay/0.0.1 (${OFF_CONTACT:dev})
