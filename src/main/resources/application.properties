spring.application.name=fantesday
spring.config.import=optional:file:.env[.properties]

# Porta HTTP: plataformas como o Render informam a porta pela variavel PORT
server.port=${PORT:8080}

# Keep-alive: chama /actuator/health da URL publica para o Render nao desligar a API por inatividade.
# No Render, RENDER_EXTERNAL_URL ja vem preenchida; localmente fica vazio e o job nao faz nada.
app.keep-alive.url=${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
app.keep-alive.interval=45s

# Supabase (PostgreSQL) database configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# O pooler gratuito do Supabase aceita 15 conexoes no total: 5 por instancia da API deixa espaco
# para rodar local e no Render ao mesmo tempo
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# O schema e criado/alterado pelas migracoes do Flyway (src/main/resources/db/migration);
# o Hibernate so confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Banco que ja existia antes do Flyway: marca a V1 como aplicada e roda so as migracoes seguintes
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Uploads: foto de refeicao ate 10 MB (a foto de perfil tem o proprio limite de 2 MB, no UserPhotoService)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# JWT: sem JWT_SECRET (min. 32 caracteres) a API gera uma chave aleatoria a cada inicializacao
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=1h
# Refresh token: usado para renovar o JWT sem pedir a senha (e para o login por Face ID no app)
app.jwt.refresh-expiration=30d

# Recuperacao de senha: validade e tentativas do codigo de 6 digitos
app.password-reset.code-expiration=15m
app.password-reset.max-attempts=5

# Origens liberadas para o frontend (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# XP ganho ao concluir uma tarefa
app.xp.task-completed=10
# XP das atividades: 1 XP a cada N minutos, com limite por atividade
app.xp.activity-minutes-per-xp=2
app.xp.activity-max=60

# Paginacao das listas de alimentos e exercicios
app.pagination.default-size=20
app.pagination.max-size=100

# Importa TACO e free-exercise-db na primeira execucao (resources/seed)
app.seed.enabled=true

# Open Food Facts (produtos industrializados)
app.openfoodfacts.base-url=https://world.openfoodfacts.org
app.openfoodfacts.user-agent=FantesDay/0.0.1 (${OFF_CONTACT:dev})

# Gemini (foto da refeicao e atividades em texto livre). Sem GEMINI_API_KEY esses recursos ficam desligados.
app.gemini.base-url=https://generativelanguage.googleapis.com
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
